services:
  # ── Backend Application ──────────────────────────
  guestguard-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ApnaManager-backend-app
    ports:
      - '${PORT:-5000}:5000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/apnamanager
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ── MongoDB Database ─────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: ApnaManager-mongo-db
    # Remove or comment out 'ports' in production to avoid exposing DB on host
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ── Redis Cache ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ApnaManager-redis-cache
    # Remove or comment out 'ports' in production to avoid exposing Redis on host
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-changeme}', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
